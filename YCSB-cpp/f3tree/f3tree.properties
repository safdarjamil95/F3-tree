# F3-tree YCSB backend properties
# Override on the command line with -p key=value

# Evaluator policy: f3n (node-based, conflict-correct) or f3k (key-based)
f3tree.evaluator_policy=f3n

# Number of background evaluator threads
f3tree.evaluator_threads=1

# In-memory hashtable capacity (should be >= recordcount)
f3tree.hash_capacity=1048576

# Checkpoint threshold: drain after this many buffered ops per producer (0=off)
f3tree.checkpoint_threshold_ops=0

# Checkpoint interval in microseconds (0=off)
f3tree.checkpoint_interval_us=0

# PMDK: path to pool file (empty = DRAM only; requires make PMDK=1 BIND_F3TREE=1)
f3tree.persistent_path=

# PMDK: pool size in bytes (only used when creating a new pool)
# Default 512 MiB — raise for large workloads (recordcount > 500k)
f3tree.persistent_pool_bytes=536870912
